# Local dev / testing: builds the image from this repo.
# Once you've pushed to GitHub and the publish workflow has run, switch to
# `image: ghcr.io/<you>/immich-portal:latest` instead — see README.md.
services:
  immich-portal:
    build: .
    container_name: immich-portal
    ports:
      - "8080:80"
    environment:
      # One tab per album: "Name|share-link;Name|share-link;..."
      # Each name/URL pair is separated by "|", pairs separated by ";".
      - ALBUMS=Ceremony|https://photos.example.com/share/aaaaaaaa;Reception|https://photos.example.com/share/bbbbbbbb
      # Optional: adds an extra "Add Photos" tab pointing at your upload proxy.
      # Omit this line entirely if you don't want an upload tab.
      - UPLOAD_URL=https://upload.example.com
      # Optional: shown at the top of the page
      - PORTAL_TITLE=Family Photo Portal
    restart: unless-stopped
